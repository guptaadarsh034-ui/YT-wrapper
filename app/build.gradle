plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.ytwrapper'
    compileSdk 33

    defaultConfig {
        applicationId "com.yourname.ytwrapper"
        minSdk 19
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
